[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-runtime-contracts"
version = "0.1.0"
description = "Reproducible semantic and side-effect checks for Python code agents"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]

[project.scripts]
agent-runtime-contracts = "runtime_contracts:main"

[tool.setuptools]
py-modules = ["runtime_contracts", "report_view"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
