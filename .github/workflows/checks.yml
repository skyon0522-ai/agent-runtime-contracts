name: Reproduce and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pytest -q
      - run: ruff check . && ruff format --check .
      - name: Record runtime diagnostics (mismatches are an experiment result)
        shell: bash
        run: |
          set +e
          python runtime_contracts.py run --output ci-report.json
          result=$?
          set -e
          if [ "$result" -gt 1 ]; then exit "$result"; fi
          echo "Diagnostic exit code: $result (0=all match; 1=mismatches observed)" >> "$GITHUB_STEP_SUMMARY"
          cat ci-report.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-observations
          path: ci-report.json
